<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deals · Jules CRM</title><style>:root{--b:#27517d;--o:#d66e38}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}header{background:#fff;padding:16px 5%;display:flex;align-items:center;gap:20px;border-bottom:1px solid #e5e7eb}header strong{color:var(--b);font-size:19px}nav{flex:1}nav a{color:#475467;text-decoration:none;margin-right:18px}nav a.active{color:var(--b);font-weight:800}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--b);color:#fff}main{max-width:1250px;margin:auto;padding:32px 24px}h1{color:var(--b);margin:0}.muted{color:#667085}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(39,81,125,.07)}.num{font-size:27px;font-weight:800;color:var(--b);margin-top:7px}.filters{display:flex;gap:10px;margin-bottom:14px}.filters input,.filters select{padding:11px;border:1px solid #d7dce2;border-radius:10px}.deal{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eef0f2}.deal a{color:var(--b);font-weight:800;text-decoration:none}.pill{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#edf3f8;color:var(--b)}.empty{padding:30px;text-align:center;color:#98a2b3}@media(max-width:850px){nav{display:none}.stats{grid-template-columns:1fr 1fr}.deal{grid-template-columns:1fr 1fr}.filters{flex-direction:column}}@media(max-width:520px){.stats,.deal{grid-template-columns:1fr}}</style></head><body><header><strong>Jules CRM</strong><nav><a href="./dashboard.html">Dashboard</a><a href="./contacts.html">Contacts</a><a href="./pipeline.html">Pipeline</a><a href="./tasks.html">Follow-ups</a><a class="active" href="./deals.html">Deals</a></nav><button class="btn" id="logout">Sign Out</button></header><main><h1>Deals & Production</h1><div class="muted">Track pending business, closings and income.</div><div class="stats"><div class="card">Open Volume<div class="num" id="openVol">$0</div></div><div class="card">Projected Income<div class="num" id="projected">$0</div></div><div class="card">Closed Volume<div class="num" id="closedVol">$0</div></div><div class="card">Actual Income<div class="num" id="actual">$0</div></div></div><div class="filters"><input id="q" placeholder="Search client or property"><select id="status"><option value="">All statuses</option><option>Prospect</option><option>Active</option><option>Under Contract</option><option>Closed</option></select><select id="side"><option value="">Buyer & Seller</option><option>Buyer</option><option>Seller</option></select><select id="period"><option value="">All time</option><option value="year">This year</option><option value="month">This month</option></select></div><div class="card" id="list"></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6'),$=x=>document.getElementById(x),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v||0),esc=v=>String(v??'').replace(/[&<>"']/g,'');const {data:{session}}=await sb.auth.getSession();if(!session)location.href='./login.html';const {data:p}=await sb.from('crm_users').select('is_active').eq('auth_user_id',session?.user?.id).single();if(!p?.is_active){await sb.auth.signOut();location.href='./login.html'}let rows=[];async function load(){const {data,error}=await sb.from('transactions').select('*,contacts(id,first_name,last_name),properties(address1,city,state)').order('closing_date',{ascending:false});if(error)return alert(error.message);rows=data||[];render()}function render(){const q=$('q').value.toLowerCase(),st=$('status').value,side=$('side').value,period=$('period').value,now=new Date();let r=rows.filter(x=>{const c=x.contacts||{},p=x.properties||{},d=x.closing_date?new Date(x.closing_date+'T12:00:00'):null;let time=true;if(period==='year')time=d&&d.getFullYear()===now.getFullYear();if(period==='month')time=d&&d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();return(!q||[c.first_name,c.last_name,p.address1,p.city].join(' ').toLowerCase().includes(q))&&(!st||x.status===st)&&(!side||x.side===side)&&time});const open=r.filter(x=>x.status!=='Closed'),closed=r.filter(x=>x.status==='Closed');$('openVol').textContent=money(open.reduce((a,x)=>a+Number(x.projected_price||0),0));$('projected').textContent=money(open.reduce((a,x)=>a+Number(x.potential_income||0),0));$('closedVol').textContent=money(closed.reduce((a,x)=>a+Number(x.sale_price||0),0));$('actual').textContent=money(closed.reduce((a,x)=>a+Number(x.actual_income||0),0));$('list').innerHTML=r.map(x=>{const c=x.contacts||{},p=x.properties||{};return '<div class="deal"><div><a href="./client.html?id='+c.id+'">'+esc(c.first_name)+' '+esc(c.last_name)+'</a><br><small class="muted">'+esc(p.address1||'No property entered')+'</small></div><span class="pill">'+esc(x.side)+'</span><span class="pill">'+esc(x.status)+'</span><div><small class="muted">Price</small><br><strong>'+money(x.status==='Closed'?x.sale_price:x.projected_price)+'</strong></div><div><small class="muted">Income</small><br><strong>'+money(x.status==='Closed'?x.actual_income:x.potential_income)+'</strong></div><div><small class="muted">Closing</small><br>'+(x.closing_date?new Date(x.closing_date+'T12:00:00').toLocaleDateString():'—')+'</div></div>'}).join('')||'<div class="empty">No transactions match these filters.</div>'}['q','status','side','period'].forEach(id=>$(id).addEventListener(id==='q'?'input':'change',render));$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./login.html'};load();</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Follow-ups · Jules CRM</title><style>
:root{--blue:#27517d;--orange:#d66e38;--red:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}header{background:#fff;padding:16px 5%;display:flex;align-items:center;gap:20px;border-bottom:1px solid #e5e7eb}header strong{color:var(--blue);font-size:19px}nav{flex:1}nav a{color:#475467;text-decoration:none;margin-right:18px}nav a.active{color:var(--blue);font-weight:800}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.blue{background:var(--blue);color:#fff}.orange{background:var(--orange);color:#fff}main{max-width:1180px;margin:auto;padding:32px 24px}h1{color:var(--blue);margin:0}.muted{color:#667085}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{background:white;border:1px solid #d7dce2;color:#475467}.tab.active{background:var(--blue);color:white}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 30px rgba(39,81,125,.07)}.task{display:grid;grid-template-columns:1fr auto;gap:16px;padding:15px 0;border-bottom:1px solid #eef0f2}.task:last-child{border:0}.task a{color:var(--blue);font-weight:800;text-decoration:none}.meta{font-size:13px;color:#667085;margin-top:5px}.overdue{color:var(--red);font-weight:800}.actions{display:flex;gap:8px;align-items:center}.small{padding:8px 10px;font-size:12px}.empty{text-align:center;color:#98a2b3;padding:36px}.modal{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;place-items:center;padding:20px}.modal.open{display:grid}.panel{background:white;border-radius:20px;padding:25px;width:min(560px,100%)}label{display:block;font-size:12px;font-weight:700;color:#667085;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px 13px;border:1px solid #d7dce2;border-radius:10px;font:inherit}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}@media(max-width:760px){nav{display:none}.top{align-items:start;flex-direction:column;gap:12px}.task{grid-template-columns:1fr}.actions{justify-content:flex-start}}</style></head>
<body><header><strong>Jules CRM</strong><nav><a href="./dashboard.html">Dashboard</a><a href="./contacts.html">Contacts</a><a href="./pipeline.html">Pipeline</a><a class="active" href="./tasks.html">Follow-ups</a><a href="./deals.html" style="color:#27517d;text-decoration:none;margin-left:12px;">Deals</a></nav><button class="btn blue" id="logout">Sign Out</button></header><main><div class="top"><div><h1>Follow-ups</h1><div class="muted">Your calls, check-ins and next actions in one place.</div></div><button class="btn orange" id="add">+ Add Follow-up</button></div><div class="tabs"><button class="btn tab active" data-view="today">Due / Overdue</button><button class="btn tab" data-view="upcoming">Upcoming</button><button class="btn tab" data-view="all">All Open</button><button class="btn tab" data-view="done">Completed</button></div><div class="card" id="list"></div></main>
<div class="modal" id="modal"><div class="panel"><h2>New Follow-up</h2><form id="form"><label>Contact</label><select id="contact" required><option value="">Choose a contact</option></select><label>What needs to be done?</label><input id="title" required placeholder="Call seller, check financing, send CMA..."><label>Details</label><textarea id="details" rows="3"></textarea><label>Due</label><input id="due" type="datetime-local" required><label>Priority</label><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><div class="formactions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn orange">Save Follow-up</button></div></form></div></div>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const {data:{session}}=await sb.auth.getSession();if(!session)location.href='./login.html';const {data:p}=await sb.from('crm_users').select('id,is_active').eq('auth_user_id',session?.user?.id).single();if(!p?.is_active){await sb.auth.signOut();location.href='./login.html'}let tasks=[],view='today';
async function load(){const [{data:t,error},{data:c}]=await Promise.all([sb.from('tasks').select('*,contacts(id,first_name,last_name)').order('due_at',{ascending:true}),sb.from('contacts').select('id,first_name,last_name').order('last_name')]);if(error)return alert(error.message);tasks=t||[];$('contact').innerHTML='<option value="">Choose a contact</option>'+(c||[]).map(x=>'<option value="'+x.id+'">'+esc(x.first_name)+' '+esc(x.last_name)+'</option>').join('');render()}
function render(){const now=new Date(),end=new Date();end.setHours(23,59,59,999);let x=tasks.filter(t=>view==='done'?t.completed_at:!t.completed_at);if(view==='today')x=x.filter(t=>t.due_at&&new Date(t.due_at)<=end);if(view==='upcoming')x=x.filter(t=>t.due_at&&new Date(t.due_at)>end);$('list').innerHTML=x.map(t=>{const c=t.contacts||{},over=!t.completed_at&&t.due_at&&new Date(t.due_at)<now;return '<div class="task"><div><a href="./client.html?id='+c.id+'">'+esc(t.title)+'</a><div class="meta">'+esc(c.first_name)+' '+esc(c.last_name)+(t.due_at?' · <span class="'+(over?'overdue':'')+'">'+(over?'OVERDUE · ':'')+new Date(t.due_at).toLocaleString()+'</span>':'')+' · '+esc(t.priority||'Normal')+'</div>'+(t.details?'<div class="meta">'+esc(t.details)+'</div>':'')+'</div><div class="actions">'+(!t.completed_at?'<button class="btn blue small done" data-id="'+t.id+'">Complete</button>':'<button class="btn small reopen" data-id="'+t.id+'">Reopen</button>')+'</div></div>'}).join('')||'<div class="empty">No follow-ups in this view.</div>';$('list').querySelectorAll('.done').forEach(b=>b.onclick=()=>complete(b.dataset.id,true));$('list').querySelectorAll('.reopen').forEach(b=>b.onclick=()=>complete(b.dataset.id,false))}
async function complete(id,done){const {error}=await sb.from('tasks').update({completed_at:done?new Date().toISOString():null}).eq('id',id);if(error)alert(error.message);else load()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});const modal=$('modal');$('add').onclick=()=>modal.classList.add('open');$('cancel').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};$('form').onsubmit=async e=>{e.preventDefault();const {error}=await sb.from('tasks').insert({contact_id:$('contact').value,assigned_to:p.id,title:$('title').value.trim(),details:$('details').value.trim()||null,due_at:new Date($('due').value).toISOString(),priority:$('priority').value});if(error)return alert(error.message);e.target.reset();modal.classList.remove('open');load()};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./login.html'};load();</script></body></html>

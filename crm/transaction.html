<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Transaction · Jules CRM</title><style>:root{--blue:#27517d;--orange:#d66e38}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}main{max-width:800px;margin:40px auto;padding:24px}.card{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(39,81,125,.08)}h1{color:var(--blue)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:700;color:#667085;display:block;margin:8px 0 5px}input,select{width:100%;padding:11px;border:1px solid #d7dce2;border-radius:10px;font:inherit}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.orange{background:var(--orange);color:white}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main><a id="back" href="#">← Back to client</a><div class="card"><h1>Add Transaction</h1><form id="form"><div class="grid"><div><label>Buyer / Seller Side</label><select id="side" required><option value="">Choose</option><option>Buyer</option><option>Seller</option></select></div><div><label>Status</label><select id="status"><option>Prospect</option><option>Active</option><option>Under Contract</option><option>Closed</option></select></div><div class="full"><label>Property Address</label><input id="address"></div><div><label>City</label><input id="city"></div><div><label>State</label><input id="state" value="NY"></div><div><label>Projected Price</label><input id="projected" type="number" step=".01"></div><div><label>Commission %</label><input id="commissionPct" type="number" step=".001"></div><div><label>Potential Company Commission</label><input id="potentialCompany" type="number" step=".01"></div><div><label>Potential Income</label><input id="potentialIncome" type="number" step=".01"></div><div><label>Sale Price</label><input id="salePrice" type="number" step=".01"></div><div><label>Actual Commission</label><input id="actualCommission" type="number" step=".01"></div><div><label>Actual Income</label><input id="actualIncome" type="number" step=".01"></div><div><label>Company Income</label><input id="companyIncome" type="number" step=".01"></div><div><label>Contract Date</label><input id="contractDate" type="date"></div><div><label>Closing Date</label><input id="closingDate" type="date"></div></div><div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn orange">Save Transaction</button></div></form></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6');const params=new URLSearchParams(location.search);const cid=params.get('contact_id');const tid=params.get('transaction_id');const {data:{session}}=await sb.auth.getSession();if(!session||!cid)location.href='./login.html';const {data:p}=await sb.from('crm_users').select('id,is_active').eq('auth_user_id',session?.user?.id).single();if(!p?.is_active)location.href='./login.html';const back='./client.html?id='+encodeURIComponent(cid);document.getElementById('back').href=back;document.getElementById('cancel').onclick=()=>location.href=back;const n=id=>{const v=document.getElementById(id).value;return v===''?null:Number(v)};if(tid){document.querySelector('h1').textContent='Edit Transaction';document.querySelector('.orange').textContent='Update Transaction';const r=await sb.from('transactions').select('*,properties(address1,city,state)').eq('id',tid).single();const t=r.data;if(t){const prop=t.properties||{};document.getElementById('address').value=prop.address1||'';document.getElementById('city').value=prop.city||'';document.getElementById('state').value=prop.state||'NY';document.getElementById('side').value=t.side||'';document.getElementById('status').value=t.status||'Prospect';document.getElementById('projected').value=t.projected_price||'';document.getElementById('commissionPct').value=t.commission_percent||'';document.getElementById('potentialCompany').value=t.potential_company_commission||'';document.getElementById('potentialIncome').value=t.potential_income||'';document.getElementById('salePrice').value=t.sale_price||'';document.getElementById('actualCommission').value=t.actual_commission||'';document.getElementById('actualIncome').value=t.actual_income||'';document.getElementById('companyIncome').value=t.company_income||'';document.getElementById('contractDate').value=t.contract_date||'';document.getElementById('closingDate').value=t.closing_date||'';}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();let property_id=null;if(tid){const existing=await sb.from('transactions').select('property_id').eq('id',tid).single();property_id=existing.data?.property_id||null}const address=document.getElementById('address').value.trim();if(address&&property_id){const pe=await sb.from('properties').update({address1:address,city:document.getElementById('city').value.trim()||null,state:document.getElementById('state').value.trim()||null}).eq('id',property_id);if(pe.error)return alert(pe.error.message)}else if(address){const pr=await sb.from('properties').insert({address1:address,city:document.getElementById('city').value.trim()||null,state:document.getElementById('state').value.trim()||null}).select('id').single();if(pr.error)return alert(pr.error.message);property_id=pr.data.id}const payload={contact_id:cid,property_id,side:document.getElementById('side').value,status:document.getElementById('status').value,projected_price:n('projected'),commission_percent:n('commissionPct'),potential_company_commission:n('potentialCompany'),potential_income:n('potentialIncome'),sale_price:n('salePrice'),actual_commission:n('actualCommission'),actual_income:n('actualIncome'),company_income:n('companyIncome'),contract_date:document.getElementById('contractDate').value||null,closing_date:document.getElementById('closingDate').value||null};let result;if(tid){result=await sb.from('transactions').update(payload).eq('id',tid)}else{result=await sb.from('transactions').insert(payload)}if(result.error)alert(result.error.message);else location.href=back};</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Pipeline · Jules CRM</title><style>
:root{--blue:#27517d;--orange:#d66e38;--gold:#de983f}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}header{background:#fff;padding:16px 5%;display:flex;align-items:center;gap:20px;border-bottom:1px solid #e5e7eb}header strong{color:var(--blue);font-size:19px}nav{flex:1}nav a{color:#475467;text-decoration:none;margin-right:18px}nav a.active{color:var(--blue);font-weight:800}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--blue);color:white}main{max-width:1500px;margin:auto;padding:30px 22px}h1{color:var(--blue);margin:0}.muted{color:#667085}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.filters{display:flex;gap:10px;margin:18px 0}.filters input,.filters select{padding:11px 13px;border:1px solid #d7dce2;border-radius:10px;background:white}.board{display:grid;grid-template-columns:repeat(8,minmax(235px,1fr));gap:14px;overflow-x:auto;padding-bottom:18px}.column{background:#eef1f4;border-radius:16px;padding:12px;min-height:520px}.colhead{display:flex;justify-content:space-between;align-items:center;padding:5px 4px 12px;font-weight:800;color:var(--blue)}.count{background:white;border-radius:999px;padding:3px 8px;font-size:12px}.lead{background:white;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 5px 18px rgba(39,81,125,.07);cursor:pointer}.lead:hover{transform:translateY(-1px)}.name{font-weight:800;margin-bottom:5px}.tag{display:inline-block;font-size:11px;font-weight:800;padding:4px 7px;border-radius:999px;background:#edf3f8;color:var(--blue);margin:4px 4px 6px 0}.detail{font-size:13px;color:#667085;line-height:1.45}.stage{width:100%;margin-top:10px;padding:8px;border:1px solid #d7dce2;border-radius:8px;background:#fff}.empty{font-size:13px;color:#98a2b3;padding:8px 4px}@media(max-width:760px){nav{display:none}.top{align-items:start;flex-direction:column;gap:10px}.filters{flex-direction:column}.filters input,.filters select{width:100%}}</style></head>
<body><header><strong>Jules CRM</strong><nav><a href="./dashboard.html">Dashboard</a><a href="./contacts.html">Contacts</a><a class="active" href="./pipeline.html">Pipeline</a></nav><button class="btn" id="logout">Sign Out</button></header><main><div class="top"><div><h1>Lead Pipeline</h1><div class="muted">Move every buyer and seller from inquiry through closing.</div></div></div><div class="filters"><input id="search" placeholder="Search leads"><select id="leadType"><option value="">All leads</option><option>Buyer</option><option>Seller</option><option>Buyer/Seller</option><option>Other</option></select><select id="source"><option value="">All sources</option></select></div><div class="board" id="board"></div></main>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6');const stages=['New Lead','Contacted','Appointment','Active Buyer/Seller','Under Contract','Closed','Past Client','Inactive'];const {data:{session}}=await sb.auth.getSession();if(!session)location.href='./login.html';const {data:p}=await sb.from('crm_users').select('id,is_active').eq('auth_user_id',session?.user?.id).single();if(!p?.is_active){await sb.auth.signOut();location.href='./login.html'}let leads=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){const {data,error}=await sb.from('leads').select('id,lead_type,source,campaign,location_interest,property_address,price_range,property_type,buyer_preferences,stage,created_at,contacts(id,first_name,last_name,email,phone)').order('created_at',{ascending:false});if(error)return alert(error.message);leads=data||[];const sources=[...new Set(leads.map(x=>x.source).filter(Boolean))].sort();document.getElementById('source').innerHTML='<option value="">All sources</option>'+sources.map(x=>'<option>'+esc(x)+'</option>').join('');render()}
function render(){const q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('leadType').value,s=document.getElementById('source').value;const filtered=leads.filter(l=>{const c=l.contacts||{};return(!q||[c.first_name,c.last_name,c.email,l.location_interest,l.property_address].join(' ').toLowerCase().includes(q))&&(!t||l.lead_type===t)&&(!s||l.source===s)});const board=document.getElementById('board');board.innerHTML=stages.map(stage=>{const items=filtered.filter(l=>l.stage===stage);return `<section class="column"><div class="colhead"><span>${stage}</span><span class="count">${items.length}</span></div>${items.map(card).join('')||'<div class="empty">No leads</div>'}</section>`}).join('');board.querySelectorAll('.stage').forEach(sel=>sel.onchange=async e=>{e.stopPropagation();const id=e.target.dataset.id,newStage=e.target.value;const {error}=await sb.from('leads').update({stage:newStage}).eq('id',id);if(error)return alert(error.message);const lead=leads.find(x=>x.id===id);if(lead){lead.stage=newStage;await sb.from('contacts').update({status:newStage,updated_at:new Date().toISOString()}).eq('id',lead.contacts.id)}render()});board.querySelectorAll('.lead').forEach(x=>x.onclick=e=>{if(e.target.tagName==='SELECT')return;location.href='./client.html?id='+encodeURIComponent(x.dataset.contact)})}
function card(l){const c=l.contacts||{};const loc=l.lead_type==='Seller'?l.property_address:l.location_interest;return `<article class="lead" data-contact="${c.id}"><div class="name">${esc(c.first_name)} ${esc(c.last_name)}</div><span class="tag">${esc(l.lead_type)}</span><span class="tag">${esc(l.source||'Unknown source')}</span><div class="detail">${loc?esc(loc)+'<br>':''}${l.price_range?esc(l.price_range)+' · ':''}${l.property_type?esc(l.property_type):''}</div><select class="stage" data-id="${l.id}">${stages.map(x=>`<option ${x===l.stage?'selected':''}>${x}</option>`).join('')}</select></article>`}
['search','leadType','source'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./login.html'};load();</script></body></html>

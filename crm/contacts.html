<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacts · Jules CRM</title><style>
:root{--blue:#27517d;--orange:#d66e38;--gold:#de983f}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}header{background:#fff;padding:16px 5%;display:flex;gap:22px;align-items:center;border-bottom:1px solid #e5e7eb}header strong{color:var(--blue);font-size:19px}nav{display:flex;gap:8px;flex:1}nav a{text-decoration:none;color:#475467;padding:9px 12px;border-radius:9px}nav a.active{background:#edf3f8;color:var(--blue);font-weight:700}.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700}.primary{background:var(--orange);color:white}.secondary{background:var(--blue);color:white}main{max-width:1180px;margin:auto;padding:34px 24px}.top{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}h1{margin:0;color:var(--blue)}.muted{color:#667085}.toolbar{display:grid;grid-template-columns:1fr 180px 180px;gap:10px;margin-bottom:16px}input,select,textarea{width:100%;padding:12px 14px;border:1px solid #d7dce2;border-radius:10px;font:inherit;background:white}.table{background:white;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(39,81,125,.07)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid #eef0f2}th{font-size:12px;text-transform:uppercase;color:#667085;background:#fafafa}tr[data-id]{cursor:pointer}tr[data-id]:hover{background:#f8fafc}.empty{text-align:center;padding:42px;color:#667085}.modal{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;place-items:center;padding:20px}.modal.open{display:grid}.panel{background:white;border-radius:20px;padding:26px;width:min(620px,100%);max-height:90vh;overflow:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.msg{min-height:20px;color:#b42318;margin-top:8px}@media(max-width:760px){nav{display:none}.toolbar,.formgrid{grid-template-columns:1fr}.top{align-items:start;flex-direction:column}.table{overflow:auto}}</style></head>
<body><header><strong>Jules CRM</strong><nav><a href="./dashboard.html">Dashboard</a><a class="active" href="./contacts.html">Contacts</a></nav><button class="btn secondary" id="logout">Sign Out</button></header>
<main><div class="top"><div><h1>Contacts</h1><div class="muted">Your buyers, sellers, prospects and past clients in one place.</div></div><button class="btn primary" id="add">+ Add Contact</button></div>
<div class="toolbar"><input id="search" placeholder="Search name, email or phone"><select id="type"><option value="">All contact types</option><option>Buyer</option><option>Seller</option><option>Buyer/Seller</option><option>Other</option></select><select id="status"><option value="">All statuses</option><option>New Lead</option><option>Contacted</option><option>Appointment</option><option>Active Buyer/Seller</option><option>Under Contract</option><option>Closed</option><option>Past Client</option><option>Inactive</option></select></div>
<div class="table"><table><thead><tr><th>Name</th><th>Type</th><th>Status</th><th>Phone</th><th>Email</th><th>Source</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">No contacts yet. Add your first contact when you're ready.</div></div></main>
<div class="modal" id="modal"><div class="panel"><h2 id="formTitle">Add Contact</h2><form id="form"><input type="hidden" id="id"><div class="formgrid"><input id="first" placeholder="First Name" required><input id="last" placeholder="Last Name" required><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Phone"><select id="contactType"><option value="">Contact Type</option><option>Buyer</option><option>Seller</option><option>Buyer/Seller</option><option>Other</option></select><select id="contactStatus"><option>New Lead</option><option>Contacted</option><option>Appointment</option><option>Active Buyer/Seller</option><option>Under Contract</option><option>Closed</option><option>Past Client</option><option>Inactive</option></select><input class="full" id="source" placeholder="Lead Source (Website, Referral, Realtor.com, etc.)"></div><div class="msg" id="msg"></div><div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save Contact</button></div></form></div></div>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6');const {data:{session}}=await sb.auth.getSession();if(!session)location.href='./login.html';
const {data:p}=await sb.from('crm_users').select('id,is_active').eq('auth_user_id',session?.user?.id).single();if(!p?.is_active){await sb.auth.signOut();location.href='./login.html'}
let all=[];const rows=document.getElementById('rows'),empty=document.getElementById('empty'),modal=document.getElementById('modal');
async function load(){const {data,error}=await sb.from('contacts').select('*').order('updated_at',{ascending:false});if(error){empty.textContent=error.message;return}all=data||[];render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){const q=document.getElementById('search').value.toLowerCase(),ty=document.getElementById('type').value,st=document.getElementById('status').value;const x=all.filter(c=>(!q||[c.first_name,c.last_name,c.email,c.phone].join(' ').toLowerCase().includes(q))&&(!ty||c.contact_type===ty)&&(!st||c.status===st));rows.innerHTML=x.map(c=>`<tr data-id="${c.id}"><td><strong>${esc(c.first_name)} ${esc(c.last_name)}</strong></td><td>${esc(c.contact_type||'—')}</td><td>${esc(c.status)}</td><td>${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.lead_source||'—')}</td></tr>`).join('');empty.style.display=x.length?'none':'block';rows.querySelectorAll('tr').forEach(r=>r.onclick=()=>location.href='./client.html?id='+encodeURIComponent(r.dataset.id))}
['search','type','status'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));
function open(){modal.classList.add('open')}function close(){modal.classList.remove('open');document.getElementById('form').reset();document.getElementById('id').value='';document.getElementById('msg').textContent='';document.getElementById('formTitle').textContent='Add Contact'}
document.getElementById('add').onclick=open;document.getElementById('cancel').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};
function edit(id){const c=all.find(x=>x.id===id);if(!c)return;document.getElementById('formTitle').textContent='Edit Contact';document.getElementById('id').value=c.id;document.getElementById('first').value=c.first_name||'';document.getElementById('last').value=c.last_name||'';document.getElementById('email').value=c.email||'';document.getElementById('phone').value=c.phone||'';document.getElementById('contactType').value=c.contact_type||'';document.getElementById('contactStatus').value=c.status||'New Lead';document.getElementById('source').value=c.lead_source||'';open()}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();const id=document.getElementById('id').value;const payload={first_name:document.getElementById('first').value.trim(),last_name:document.getElementById('last').value.trim(),email:document.getElementById('email').value.trim()||null,phone:document.getElementById('phone').value.trim()||null,contact_type:document.getElementById('contactType').value||null,status:document.getElementById('contactStatus').value,lead_source:document.getElementById('source').value.trim()||null,updated_at:new Date().toISOString()};const q=id?sb.from('contacts').update(payload).eq('id',id):sb.from('contacts').insert(payload);const {error}=await q;if(error){document.getElementById('msg').textContent=error.message;return}close();await load()};
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./login.html'};load();</script></body></html>

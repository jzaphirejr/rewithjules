<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client · Jules CRM</title><style>
:root{--blue:#27517d;--orange:#d66e38;--gold:#de983f}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}header{background:white;padding:16px 5%;display:flex;align-items:center;gap:20px;border-bottom:1px solid #e5e7eb}header strong{color:var(--blue);font-size:19px}nav{flex:1}nav a{color:#475467;text-decoration:none;margin-right:18px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.blue{background:var(--blue);color:white}.orange{background:var(--orange);color:white}main{max-width:1180px;margin:auto;padding:32px 24px}.back{color:var(--blue);text-decoration:none}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 0}.head h1{margin:0;color:var(--blue)}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(39,81,125,.07)}.wide{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#667085;margin:12px 0 5px}input,select,textarea{width:100%;padding:11px 13px;border:1px solid #d7dce2;border-radius:10px;font:inherit}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #eef0f2}.note{padding:14px 0;border-bottom:1px solid #eef0f2;white-space:pre-wrap}.actions{display:flex;gap:10px;margin-top:14px}.money{font-weight:800;color:var(--blue)}@media(max-width:760px){.grid,.two{grid-template-columns:1fr}.wide{grid-column:auto}.head{align-items:start;flex-direction:column;gap:12px}}</style></head>
<body><header><strong>Jules CRM</strong><nav><a href="./dashboard.html">Dashboard</a><a href="./contacts.html">Contacts</a><a href="./pipeline.html">Pipeline</a><a href="./tasks.html">Follow-ups</a><a href="./deals.html">Deals</a><a href="./reports.html">Reports</a></nav><button class="btn blue" id="logout">Sign Out</button></header><main><a class="back" href="./contacts.html">← Back to Contacts</a><div class="head"><div><h1 id="name">Client</h1><div class="muted" id="summary"></div></div><button class="btn orange" id="save">Save Profile</button></div>
<div class="grid"><section class="card"><h2>Contact</h2><div class="two"><div><label>First Name</label><input id="first"></div><div><label>Last Name</label><input id="last"></div><div><label>Email</label><input id="email" type="email"></div><div><label>Phone</label><input id="phone"></div><div><label>Contact Type</label><select id="type"><option value="">—</option><option>Buyer</option><option>Seller</option><option>Buyer/Seller</option><option>Other</option></select></div><div><label>Status</label><select id="status"><option>New Lead</option><option>Lead</option><option>Lead</option><option>Active Client</option><option>Active Client</option><option>Closed</option><option>Passive Client</option><option>Terminated</option></select></div></div><label>Lead Source</label><input id="source"><label>General Notes</label><textarea id="generalNotes" rows="4"></textarea></section>
<section class="card"><h2>Follow-up</h2><label>Next Follow-up</label><input id="follow" type="datetime-local"><label>Last Contact</label><input id="lastContact" type="datetime-local"><div class="actions"><button class="btn orange" id="makeTask">Create Follow-up Task</button></div><div id="tasks"></div></section>
<section class="card"><h2>Notes & Activity</h2><textarea id="noteText" rows="4" placeholder="Add a date-stamped note about a call, appointment, conversation or update..."></textarea><div class="actions"><button class="btn orange" id="addNote">Add Note</button></div><div id="notes"></div></section>
<section class="card"><h2>Transactions</h2><div id="transactions"></div><div class="actions"><button class="btn orange" id="addTransaction">+ Add Transaction</button></div></section>
</div></main>
<script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6');const id=new URLSearchParams(location.search).get('id');const {data:{session}}=await sb.auth.getSession();if(!session||!id)location.href='./login.html';const {data:p}=await sb.from('crm_users').select('id,is_active').eq('auth_user_id',session?.user?.id).single();if(!p?.is_active){await sb.auth.signOut();location.href='./login.html'}
const $=x=>document.getElementById(x);let contact;
const dt=v=>v?new Date(v).toISOString().slice(0,16):'';const money=v=>v==null?'—':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v);
async function load(){const {data,error}=await sb.from('contacts').select('*').eq('id',id).single();if(error)return alert(error.message);contact=data;$('first').value=data.first_name||'';$('last').value=data.last_name||'';$('email').value=data.email||'';$('phone').value=data.phone||'';$('type').value=data.contact_type||'';$('status').value=data.status;$('source').value=data.lead_source||'';$('generalNotes').value=data.notes||'';$('follow').value=dt(data.next_follow_up_at);$('lastContact').value=dt(data.last_contact_at);$('name').textContent=data.first_name+' '+data.last_name;$('summary').textContent=[data.contact_type,data.status,data.lead_source].filter(Boolean).join(' · ');await Promise.all([loadNotes(),loadTasks(),loadTransactions()])}
$('save').onclick=async()=>{const payload={first_name:$('first').value.trim(),last_name:$('last').value.trim(),email:$('email').value.trim()||null,phone:$('phone').value.trim()||null,contact_type:$('type').value||null,status:$('status').value,lead_source:$('source').value.trim()||null,notes:$('generalNotes').value.trim()||null,next_follow_up_at:$('follow').value?new Date($('follow').value).toISOString():null,last_contact_at:$('lastContact').value?new Date($('lastContact').value).toISOString():null,updated_at:new Date().toISOString()};const {error}=await sb.from('contacts').update(payload).eq('id',id);if(error)alert(error.message);else load()};
async function loadNotes(){const {data}=await sb.from('activities').select('*').eq('contact_id',id).order('occurred_at',{ascending:false});$('notes').innerHTML=(data||[]).map(n=>`<div class="note"><small class="muted">${new Date(n.occurred_at).toLocaleString()} · ${n.activity_type}</small><br>${esc(n.body)}</div>`).join('')||'<p class="muted">No activity yet.</p>'}
$('addNote').onclick=async()=>{const body=$('noteText').value.trim();if(!body)return;const {error}=await sb.from('activities').insert({contact_id:id,user_id:p.id,activity_type:'Note',body});if(error)alert(error.message);else{$('noteText').value='';await loadNotes()}};
async function loadTasks(){const {data}=await sb.from('tasks').select('*').eq('contact_id',id).order('due_at',{ascending:true});$('tasks').innerHTML=(data||[]).map(t=>`<div class="row"><div><strong>${esc(t.title)}</strong><br><small class="muted">${t.due_at?new Date(t.due_at).toLocaleString():'No due date'}</small></div><button class="btn" data-task="${t.id}" data-done="${t.completed_at?'1':'0'}">${t.completed_at?'Reopen':'Complete'}</button></div>`).join('')||'<p class="muted">No follow-up tasks yet.</p>'}
$('makeTask').onclick=async()=>{const due=$('follow').value;if(!due)return alert('Choose a next follow-up date and time first.');const {error}=await sb.from('tasks').insert({contact_id:id,assigned_to:p.id,title:'Follow up with '+$('first').value+' '+$('last').value,due_at:new Date(due).toISOString()});if(error)alert(error.message);else loadTasks()};
$('tasks').onclick=async e=>{const b=e.target.closest('[data-task]');if(!b)return;const completed=b.dataset.done==='1'?null:new Date().toISOString();const {error}=await sb.from('tasks').update({completed_at:completed}).eq('id',b.dataset.task);if(error)alert(error.message);else loadTasks()};async function loadTransactions(){const {data}=await sb.from('transactions').select('*,properties(address1,city,state)').eq('contact_id',id).order('created_at',{ascending:false});$('transactions').innerHTML=(data||[]).map(t=>`<div class="row"><div><strong>${esc(t.side||'Transaction')} · ${esc(t.status)}</strong><br><small class="muted">${esc(t.properties?.address1||'No property')} ${esc(t.properties?.city||'')}</small></div><div><div class="money">${money(t.sale_price??t.projected_price)}</div><a href="./transaction.html?contact_id=${encodeURIComponent(id)}&transaction_id=${encodeURIComponent(t.id)}">Edit deal</a></div></div>`).join('')||'<p class="muted">No transactions yet.</p>'}
$('addTransaction').onclick=()=>location.href='./transaction.html?contact_id='+encodeURIComponent(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./login.html'};load();</script></body></html>

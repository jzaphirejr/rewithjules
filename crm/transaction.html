<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Transaction · Jules CRM</title><style>:root{--blue:#27517d;--orange:#d66e38}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}main{max-width:800px;margin:40px auto;padding:24px}.card{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px rgba(39,81,125,.08)}h1{color:var(--blue)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;font-weight:700;color:#667085;display:block;margin:8px 0 5px}input,select{width:100%;padding:11px;border:1px solid #d7dce2;border-radius:10px;font:inherit}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.orange{background:var(--orange);color:white}.invoice{background:#27517d;color:#fff}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}.docs{margin-top:18px;padding-top:14px;border-top:1px solid #e5e7eb;font-size:12px}.docs summary{cursor:pointer;color:var(--blue);font-weight:700}.docrow{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid #f0f2f4}.docdate{color:#667085;white-space:nowrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.docrow{display:block}.docdate{margin-top:3px}}</style></head><body><header style="background:#fff;padding:16px 5%;border-bottom:1px solid #e5e7eb"><strong style="color:#27517d">Jules CRM</strong> &nbsp; <a href="./dashboard.html">Dashboard</a> &nbsp; <a href="./contacts.html">Contacts</a> &nbsp; <a href="./pipeline.html">Pipeline</a> &nbsp; <a href="./tasks.html">Follow-ups</a> &nbsp; <a href="./deals.html">Deals</a> &nbsp; <a href="./properties.html">Properties</a> &nbsp; <a href="./reports.html">Reports</a></header><main><a id="back" href="#">← Back to client</a><div class="card"><h1>Add Transaction</h1><form id="form"><div class="grid"><div><label>Buyer / Seller Side</label><select id="side" required><option value="">Choose</option><option>Buyer</option><option>Seller</option></select></div><div><label>Status</label><select id="status"><option>Active</option><option>Offer Submitted</option><option>Offer Declined</option><option>Offer Accepted</option><option>Under Contract</option><option>Inactive</option><option>Terminated</option><option>Closed</option></select></div><div class="full"><label>Property Address</label><input id="address"></div><div><label>City</label><input id="city"></div><div><label>State</label><input id="state" value="NY"></div><div><label>Projected Price & Commission Type</label><input id="projected" type="number" step=".01"><div style="display:flex;gap:18px;margin-top:8px;font-size:13px"><label style="margin:0"><input type="radio" name="potentialMode" value="pct" checked style="width:auto"> %</label><label style="margin:0"><input type="radio" name="potentialMode" value="dollar" style="width:auto"> $</label></div></div><div><label>Commission % (0–100)</label><input id="commissionPct" type="number" min="0" max="100" step=".001"></div><div><label>Commission Amount</label><input id="potentialCompany" type="number" step=".01"></div><div><label>Split %</label><input id="potentialSplit" type="number" min="0" max="100" step=".001"></div><div><label>Potential Income</label><input id="potentialIncome" type="number" step=".01" readonly></div><div><label>Sale Price & Actual Commission Type</label><input id="salePrice" type="number" step=".01"><div style="display:flex;gap:18px;margin-top:8px;font-size:13px"><label style="margin:0"><input type="radio" name="actualMode" value="pct" checked style="width:auto"> %</label><label style="margin:0"><input type="radio" name="actualMode" value="dollar" style="width:auto"> $</label></div></div><div><label>Actual Commission % (0–100)</label><input id="actualCommissionPct" type="number" min="0" max="100" step=".001"></div><div><label>Actual Commission</label><input id="actualCommission" type="number" step=".01"></div><div><label>Split %</label><input id="actualSplit" type="number" min="0" max="100" step=".001"></div><div><label>Actual Income</label><input id="actualIncome" type="number" step=".01" readonly></div><div><label>Company Income</label><input id="companyIncome" type="number" step=".01" readonly></div><div><label>Contract Date</label><input id="contractDate" type="date"></div><div><label>Closing Date</label><input id="closingDate" type="date"></div></div><div class="actions"><button type="button" class="btn invoice" id="invoice" style="display:none">Generate Invoice</button><button type="button" class="btn" id="cancel">Cancel</button><button class="btn orange">Save Transaction</button></div></form><details class="docs" id="docsWrap" style="display:none"><summary id="docsSummary">Generated Documents</summary><div id="docsList"></div></details></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6');const params=new URLSearchParams(location.search),cid=params.get('contact_id'),tid=params.get('transaction_id'),el=id=>document.getElementById(id),n=id=>{const v=el(id).value;return v===''?null:Number(v)},money2=v=>Math.round((Number(v)||0)*100)/100;const{data:{session}}=await sb.auth.getSession();if(!session||!cid)location.href='./login.html';const{data:p}=await sb.from('crm_users').select('id,is_active').eq('auth_user_id',session?.user?.id).single();if(!p?.is_active)location.href='./login.html';const back='./client.html?id='+encodeURIComponent(cid);el('back').href=back;el('cancel').onclick=()=>location.href=back;if(tid){el('invoice').style.display='inline-block';el('invoice').onclick=()=>location.href='./invoice.html?contact_id='+encodeURIComponent(cid)+'&transaction_id='+encodeURIComponent(tid);const{data:docs}=await sb.from('transaction_documents').select('id,document_type,document_name,created_at').eq('transaction_id',tid).order('created_at',{ascending:false});if(docs?.length){el('docsWrap').style.display='block';el('docsSummary').textContent='Generated Documents ('+docs.length+')';el('docsList').innerHTML=docs.map(d=>'<div class="docrow"><span>'+String(d.document_name||d.document_type).replace(/[<>]/g,'')+'</span><span class="docdate">Created '+new Date(d.created_at).toLocaleString()+'</span></div>').join('')}}function mode(name){return document.querySelector('input[name="'+name+'"]:checked').value}function calcPotential(){const price=n('projected'),pct=n('commissionPct');if(mode('potentialMode')==='pct'){el('commissionPct').disabled=false;el('potentialCompany').readOnly=true;el('potentialCompany').value=price!=null&&pct!=null?money2(price*pct/100):''}else{el('commissionPct').disabled=true;el('commissionPct').value='';el('potentialCompany').readOnly=false}const c=n('potentialCompany'),s=n('potentialSplit');el('potentialIncome').value=c!=null&&s!=null?money2(c*s/100):''}function calcActual(){const sale=n('salePrice'),pct=n('actualCommissionPct');if(mode('actualMode')==='pct'){el('actualCommissionPct').disabled=false;el('actualCommission').readOnly=true;el('actualCommission').value=sale!=null&&pct!=null?money2(sale*pct/100):''}else{el('actualCommissionPct').disabled=true;el('actualCommissionPct').value='';el('actualCommission').readOnly=false}const c=n('actualCommission'),s=n('actualSplit');if(c!=null&&s!=null){const i=money2(c*s/100);el('actualIncome').value=i;el('companyIncome').value=money2(c-i)}else{el('actualIncome').value='';el('companyIncome').value=''}}['projected','commissionPct','potentialCompany','potentialSplit'].forEach(id=>el(id).addEventListener('input',calcPotential));['salePrice','actualCommissionPct','actualCommission','actualSplit'].forEach(id=>el(id).addEventListener('input',calcActual));document.querySelectorAll('input[name="potentialMode"]').forEach(x=>x.addEventListener('change',calcPotential));document.querySelectorAll('input[name="actualMode"]').forEach(x=>x.addEventListener('change',calcActual));if(tid){document.querySelector('h1').textContent='Edit Transaction';document.querySelector('.orange').textContent='Update Transaction';const r=await sb.from('transactions').select('*,properties(address1,city,state)').eq('id',tid).single(),t=r.data;if(t){const prop=t.properties||{};el('address').value=prop.address1||'';el('city').value=prop.city||'';el('state').value=prop.state||'NY';el('side').value=t.side||'';el('status').value=t.status||'Active';el('projected').value=t.projected_price||'';el('commissionPct').value=t.commission_percent||'';el('potentialCompany').value=t.potential_company_commission||'';el('potentialIncome').value=t.potential_income||'';if(t.potential_company_commission&&t.potential_income!=null)el('potentialSplit').value=Math.round(Number(t.potential_income)/Number(t.potential_company_commission)*100000)/1000;el('salePrice').value=t.sale_price||'';el('actualCommission').value=t.actual_commission||'';el('actualIncome').value=t.actual_income||'';el('companyIncome').value=t.company_income||'';if(t.actual_commission&&t.actual_income!=null)el('actualSplit').value=Math.round(Number(t.actual_income)/Number(t.actual_commission)*100000)/1000;el('contractDate').value=t.contract_date||'';el('closingDate').value=t.closing_date||'';}}el('form').onsubmit=async e=>{e.preventDefault();let property_id=null;if(tid){const existing=await sb.from('transactions').select('property_id').eq('id',tid).single();property_id=existing.data?.property_id||null}const address=el('address').value.trim();if(address&&property_id){const pe=await sb.from('properties').update({address1:address,city:el('city').value.trim()||null,state:el('state').value.trim()||null}).eq('id',property_id);if(pe.error)return alert(pe.error.message)}else if(address){const pr=await sb.from('properties').insert({address1:address,city:el('city').value.trim()||null,state:el('state').value.trim()||null}).select('id').single();if(pr.error)return alert(pr.error.message);property_id=pr.data.id}const payload={contact_id:cid,property_id,side:el('side').value,status:el('status').value,projected_price:n('projected'),commission_percent:mode('potentialMode')==='pct'?n('commissionPct'):null,potential_company_commission:n('potentialCompany'),potential_income:n('potentialIncome'),sale_price:n('salePrice'),actual_commission:n('actualCommission'),actual_income:n('actualIncome'),company_income:n('companyIncome'),contract_date:el('contractDate').value||null,closing_date:el('closingDate').value||null};let result;if(tid)result=await sb.from('transactions').update(payload).eq('id',tid);else result=await sb.from('transactions').insert(payload);if(result.error)alert(result.error.message);else location.href=back};</script></body></html>

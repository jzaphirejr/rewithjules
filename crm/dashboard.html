<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jules CRM Dashboard</title><style>
:root{--blue:#27517d;--orange:#d66e38;--gold:#de983f}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#1f2937}header{background:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb}h1{color:var(--blue);margin:0}.logout{border:0;background:var(--blue);color:white;padding:10px 16px;border-radius:10px;cursor:pointer}main{max-width:1180px;margin:auto;padding:38px 24px}.welcome{margin-bottom:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px rgba(39,81,125,.08)}.num{font-size:32px;font-weight:800;color:var(--blue);margin-top:8px}.wide{grid-column:span 2}.muted{color:#667085}.work{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #eef0f2}.item a{color:var(--blue);font-weight:700;text-decoration:none}.overdue{color:#b42318;font-weight:800}.pill{font-size:11px;padding:4px 7px;border-radius:999px;background:#edf3f8;color:var(--blue);font-weight:800}.money{font-size:24px}.empty{color:#98a2b3;padding:12px 0}@media(max-width:800px){.grid,.work{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head>
<body><header><div><strong>Jules CRM</strong> &nbsp; <a href="./dashboard.html" style="color:#27517d;text-decoration:none;margin-left:18px;">Dashboard</a> <a href="./contacts.html" style="color:#27517d;text-decoration:none;margin-left:12px;">Contacts</a> <a href="./pipeline.html" style="color:#27517d;text-decoration:none;margin-left:12px;">Pipeline</a></div><button class="logout" id="logout">Sign Out</button></header><main><div class="welcome"><h1>Dashboard</h1><p class="muted" id="who">Loading your CRM…</p></div><div class="grid">
<div class="card"><span>New Leads</span><div class="num" id="newLeads">0</div></div><div class="card"><span>Follow-ups Due</span><div class="num" id="tasks">0</div></div><div class="card"><span>Under Contract</span><div class="num" id="contracts">0</div></div><div class="card"><span>Closed</span><div class="num" id="closed">0</div></div>
<div class="card"><span>Projected Income</span><div class="num money" id="projected">$0</div></div><div class="card"><span>Actual Income</span><div class="num money" id="actual">$0</div></div><div class="card"><span>Open Pipeline Value</span><div class="num money" id="pipelineValue">$0</div></div><div class="card"><span>Closed Volume</span><div class="num money" id="closedVolume">$0</div></div></div><div class="work"><section class="card"><h3>Today's Priorities</h3><div id="priorityList"></div></section><section class="card"><h3>Newest Leads</h3><div id="leadList"></div></section></div><div class="work"><section class="card"><h3>Upcoming Closings</h3><div id="closingList"></div></section><section class="card"><h3>Business Snapshot</h3><div id="snapshot"></div></section>
</div></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const supabase=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6');
const {data:{session}}=await supabase.auth.getSession();if(!session){location.href='./login.html'}else{
const {data:profile,error}=await supabase.from('crm_users').select('full_name,role,is_active').eq('auth_user_id',session.user.id).single();
if(error||!profile?.is_active){await supabase.auth.signOut();location.href='./login.html'}else{document.getElementById('who').textContent='Welcome, '+(profile.full_name||session.user.email)+' · '+profile.role;
const [lr,tr,xr]=await Promise.all([supabase.from('leads').select('id,lead_type,source,stage,created_at,contacts(id,first_name,last_name)').order('created_at',{ascending:false}),supabase.from('tasks').select('id,title,due_at,priority,completed_at,contacts(id,first_name,last_name)').is('completed_at',null).order('due_at',{ascending:true}),supabase.from('transactions').select('id,status,projected_price,potential_income,sale_price,actual_income,closing_date,contacts(id,first_name,last_name),properties(address1)').order('closing_date',{ascending:true})]);
const leads=lr.data||[],tasks=tr.data||[],tx=xr.data||[],now=new Date(),end=new Date();end.setHours(23,59,59,999);const due=tasks.filter(x=>x.due_at&&new Date(x.due_at)<=end),up=tx.filter(x=>x.closing_date&&new Date(x.closing_date+'T23:59:59')>=now&&x.status!=='Closed'),money=v=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(v||0);
document.getElementById('newLeads').textContent=leads.filter(x=>x.stage==='New Lead').length;document.getElementById('tasks').textContent=due.length;document.getElementById('contracts').textContent=tx.filter(x=>x.status==='Under Contract').length;document.getElementById('closed').textContent=up.length;document.getElementById('projected').textContent=money(tx.filter(x=>x.status!=='Closed').reduce((a,x)=>a+Number(x.potential_income||0),0));document.getElementById('actual').textContent=money(tx.filter(x=>x.status==='Closed').reduce((a,x)=>a+Number(x.actual_income||0),0));document.getElementById('pipelineValue').textContent=money(tx.filter(x=>x.status!=='Closed').reduce((a,x)=>a+Number(x.projected_price||0),0));document.getElementById('closedVolume').textContent=money(tx.filter(x=>x.status==='Closed').reduce((a,x)=>a+Number(x.sale_price||0),0));const esc=v=>String(v||'').replace(/[&<>]/g,'');
document.getElementById('priorityList').innerHTML=due.slice(0,8).map(t=>{const c=t.contacts||{},over=new Date(t.due_at)<now;return '<div class="item"><div><a href="./client.html?id='+c.id+'">'+esc(t.title)+'</a><br><small class="'+(over?'overdue':'muted')+'">'+(over?'OVERDUE · ':'')+new Date(t.due_at).toLocaleString()+'</small></div><span class="pill">'+esc(t.priority||'Normal')+'</span></div>'}).join('')||'<div class="empty">Nothing due today.</div>';document.getElementById('leadList').innerHTML=leads.slice(0,6).map(l=>{const c=l.contacts||{};return '<div class="item"><div><a href="./client.html?id='+c.id+'">'+esc(c.first_name)+' '+esc(c.last_name)+'</a><br><small class="muted">'+esc(l.lead_type)+' · '+esc(l.source||'Unknown source')+'</small></div><span class="pill">'+esc(l.stage)+'</span></div>'}).join('')||'<div class="empty">No leads yet.</div>';document.getElementById('closingList').innerHTML=up.slice(0,6).map(t=>{const c=t.contacts||{},pr=t.properties||{};return '<div class="item"><div><a href="./client.html?id='+c.id+'">'+esc(c.first_name)+' '+esc(c.last_name)+'</a><br><small class="muted">'+esc(pr.address1||'Property')+' · '+new Date(t.closing_date+'T12:00:00').toLocaleDateString()+'</small></div><strong>'+money(t.sale_price||t.projected_price)+'</strong></div>'}).join('')||'<div class="empty">No upcoming closings entered.</div>';const month=new Date(now.getFullYear(),now.getMonth(),1);document.getElementById('snapshot').innerHTML='<div class="item"><span>Website leads</span><strong>'+leads.filter(x=>x.source==='Jules Website').length+'</strong></div><div class="item"><span>Appointments</span><strong>'+leads.filter(x=>x.stage==='Appointment').length+'</strong></div><div class="item"><span>Active buyers / sellers</span><strong>'+leads.filter(x=>x.stage==='Active Buyer/Seller').length+'</strong></div><div class="item"><span>Closed this month</span><strong>'+tx.filter(x=>x.status==='Closed'&&x.closing_date&&new Date(x.closing_date)>=month).length+'</strong></div>';}}
document.getElementById('logout').onclick=async()=>{await supabase.auth.signOut();location.href='./login.html'};
</script></body></html>

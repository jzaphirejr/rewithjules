<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Listing Buyer Activity · Jules CRM</title><style>:root{--blue:#27517d;--orange:#d66e38}*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f5f6f8;color:#1f2937}header{background:white;padding:18px 5%;display:flex;gap:20px;flex-wrap:wrap}a{color:var(--blue)}nav a{margin-right:14px}main{max-width:1160px;margin:30px auto;padding:0 20px}.card{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 6px 25px #27517d12}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:bold;margin:10px 0 5px;color:#667085}input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}button{background:var(--blue);color:white;border:0;border-radius:9px;padding:11px 16px;cursor:pointer;margin-top:12px}.orange{background:var(--orange)}.muted{color:#667085}.row{padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.small{font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{margin:0}.hidden{display:none}h1{color:var(--blue)}@media(max-width:680px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header><strong>Jules CRM</strong><nav><a href="./dashboard.html">Dashboard</a><a href="./contacts.html">Contacts</a><a href="./properties.html">Properties</a><a href="./tasks.html">Follow-ups</a></nav></header><main><h1>Listing Buyer Activity</h1><p class="muted">Track inquiries, representation, showings, feedback and property-specific follow-ups.</p><div class="card"><label>Listing</label><select id="property"></select><p id="summary" class="muted"></p></div><div class="card"><h2>Add Interested Buyer</h2><div class="grid"><div class="full"><label>Existing contact (optional)</label><select id="existing"><option value="">Create a new contact</option></select></div><div><label>First name</label><input id="first"></div><div><label>Last name</label><input id="last"></div><div><label>Email</label><input id="email" type="email"></div><div><label>Phone</label><input id="phone"></div><div><label>Representation</label><select id="representation"><option>Unknown</option><option>Unrepresented</option><option>Represented by another agent</option><option>My buyer client</option></select></div><div><label>Lead source</label><input id="source" placeholder="Open house, Zillow, agent inquiry"></div><div><label>Buyer's agent</label><input id="agent"></div><div><label>Agent brokerage</label><input id="brokerage"></div><div><label>Agent phone</label><input id="agentPhone"></div><div><label>Agent email</label><input id="agentEmail"></div></div><button id="add" class="orange">Add Buyer to Listing</button><p id="addMessage" class="muted"></p></div><div class="card"><h2>Interested Buyers <span id="count"></span></h2><div id="buyers"></div></div><div class="card hidden" id="detail"><h2 id="buyerTitle"></h2><p id="buyerLink"></p><div class="grid"><div><label>Pipeline stage</label><select id="stage"><option>New Inquiry</option><option>Contacted</option><option>Showing Scheduled</option><option>Showing Completed</option><option>Strong Interest</option><option>Offer Submitted</option><option>No Longer Interested</option></select></div><div><label>Interest level</label><select id="level"><option>Unknown</option><option>Very interested</option><option>Considering</option><option>Needs follow-up</option><option>Not interested</option></select></div><div class="full"><label>Property-specific notes</label><textarea id="notes" rows="2"></textarea></div></div><button id="save">Save Buyer Status</button><h3>Log an Interaction</h3><div class="grid"><div><label>Type</label><select id="activityType"><option>Call</option><option>Text</option><option>Email</option><option>Showing</option><option>Open House</option><option>Feedback</option><option>Other</option></select></div><div><label>Date and time</label><input id="occurred" type="datetime-local"></div><div class="full"><label>Interaction notes</label><textarea id="body" rows="3"></textarea></div><div class="full"><label><input id="makeFollow" type="checkbox" style="width:auto"> Create follow-up task</label></div><div id="followFields" class="full hidden"><label>Follow-up action</label><input id="followTitle" placeholder="Call buyer about this listing"><label>Due date/time</label><input id="followDue" type="datetime-local"><label>Priority</label><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><label>Assign to</label><select id="assignee"></select></div></div><button class="orange" id="log">Save Interaction</button><p id="message" class="muted"></p><h3>Interaction History</h3><div id="history"></div><h3>Open Follow-ups</h3><div id="followups"></div></div></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2';const sb=createClient('https://vcpxkvswwhfxmquwzovp.supabase.co','sb_publishable_r9yr-jGJPQLR4lTW__K_KA_TSAMlWG6'),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let contacts=[],interests=[],active=null,me=null;const session=await sb.auth.getUser();if(!session.data.user)location.href='./login.html';const users=await sb.from('crm_users').select('id,full_name,auth_user_id').eq('is_active',true);me=(users.data||[]).find(x=>x.auth_user_id===session.data.user?.id);$('assignee').innerHTML='<option value="">Unassigned</option>'+(users.data||[]).map(x=>'<option value="'+x.id+'">'+esc(x.full_name)+'</option>').join('');if(me)$('assignee').value=me.id;const properties=await sb.from('properties').select('id,address1,city,state,listing_status').order('address1');$('property').innerHTML=(properties.data||[]).map(p=>'<option value="'+p.id+'">'+esc(p.address1+', '+(p.city||'')+' '+(p.state||''))+'</option>').join('');const qs=new URLSearchParams(location.search);if(qs.get('property_id'))$('property').value=qs.get('property_id');async function loadContacts(){const r=await sb.from('contacts').select('id,first_name,last_name,email,phone').order('last_name');contacts=r.data||[];$('existing').innerHTML='<option value="">Create a new contact</option>'+contacts.map(c=>'<option value="'+c.id+'">'+esc(c.first_name+' '+c.last_name+(c.email?' — '+c.email:''))+'</option>').join('')}await loadContacts();$('existing').onchange=()=>{const c=contacts.find(x=>x.id===$('existing').value);for(const [k,v] of [['first','first_name'],['last','last_name'],['email','email'],['phone','phone']])$(k).value=c?.[v]||''};$('property').onchange=refresh;async function refresh(){active=null;$('detail').classList.add('hidden');const id=$('property').value;if(!id)return;const r=await sb.from('listing_interests').select('*').eq('property_id',id).order('created_at',{ascending:false});if(r.error){$('buyers').textContent=r.error.message;return}interests=r.data||[];$('count').textContent='('+interests.length+')';const open=interests.filter(x=>x.stage!=='No Longer Interested');$('summary').textContent=interests.length+' total prospects · '+open.length+' active · '+open.filter(x=>x.interest_level==='Very interested').length+' very interested';$('buyers').innerHTML=interests.map(x=>{const c=contacts.find(y=>y.id===x.contact_id);return '<div class="row"><strong>'+esc(c?c.first_name+' '+c.last_name:'Contact')+'</strong> · '+esc(x.stage)+' · '+esc(x.interest_level)+'<div class="small muted">'+esc(x.representation)+' · '+esc(x.source||'No source')+'</div><div class="actions"><button data-open="'+x.id+'">View interactions & follow-ups</button></div></div>'}).join('')||'<p class="muted">No interested buyers logged for this listing.</p>'}await refresh();$('buyers').onclick=e=>{const b=e.target.closest('[data-open]');if(b)openInterest(b.dataset.open)};async function openInterest(id){active=interests.find(x=>x.id===id);if(!active)return;const c=contacts.find(x=>x.id===active.contact_id);$('detail').classList.remove('hidden');$('buyerTitle').textContent=(c?.first_name||'')+' '+(c?.last_name||'');$('buyerLink').innerHTML='<a href="./client.html?id='+encodeURIComponent(active.contact_id)+'">Open contact profile</a> · '+esc(active.representation)+(active.agent_name?' · Agent: '+esc(active.agent_name):'');$('stage').value=active.stage;$('level').value=active.interest_level;$('notes').value=active.notes||'';$('occurred').value=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);await history();$('detail').scrollIntoView({behavior:'smooth'})}async function history(){if(!active)return;const [h,t]=await Promise.all([sb.from('listing_interactions').select('*').eq('listing_interest_id',active.id).order('occurred_at',{ascending:false}),sb.from('tasks').select('*').eq('listing_interest_id',active.id).is('completed_at',null).order('due_at')]);$('history').innerHTML=(h.data||[]).map(x=>'<div class="row"><strong>'+esc(x.activity_type)+'</strong> · '+new Date(x.occurred_at).toLocaleString()+'<div>'+esc(x.body)+'</div><div class="small muted">'+esc((users.data||[]).find(u=>u.id===x.created_by)?.full_name||'CRM user')+'</div></div>').join('')||'<p class="muted">No interactions yet.</p>';$('followups').innerHTML=(t.data||[]).map(x=>'<div class="row">'+esc(x.title)+' · '+new Date(x.due_at).toLocaleString()+' <a href="./tasks.html">Open tasks</a></div>').join('')||'<p class="muted">No open follow-ups.</p>'}$('add').onclick=async()=>{const pid=$('property').value;if(!pid)return alert('Choose a listing');let cid=$('existing').value;if(!cid){if(!$('first').value.trim()||!$('last').value.trim())return alert('Enter first and last name');const r=await sb.from('contacts').insert({first_name:$('first').value.trim(),last_name:$('last').value.trim(),email:$('email').value.trim()||null,phone:$('phone').value.trim()||null,contact_type:'Other',status:'Lead',lead_source:$('source').value.trim()||'Listing inquiry'}).select('id').single();if(r.error)return alert(r.error.message);cid=r.data.id;await loadContacts()}const r=await sb.from('listing_interests').upsert({property_id:pid,contact_id:cid,representation:$('representation').value,agent_name:$('agent').value.trim()||null,agent_brokerage:$('brokerage').value.trim()||null,agent_phone:$('agentPhone').value.trim()||null,agent_email:$('agentEmail').value.trim()||null,source:$('source').value.trim()||null},{onConflict:'property_id,contact_id'}).select('id').single();if(r.error)return alert(r.error.message);$('addMessage').textContent='Buyer linked to this listing.';await refresh();await openInterest(r.data.id)};$('save').onclick=async()=>{if(!active)return;const r=await sb.from('listing_interests').update({stage:$('stage').value,interest_level:$('level').value,notes:$('notes').value,updated_at:new Date().toISOString()}).eq('id',active.id);if(r.error)return alert(r.error.message);const id=active.id;await refresh();await openInterest(id)};$('makeFollow').onchange=()=>{$('followFields').classList.toggle('hidden',!$('makeFollow').checked)};$('log').onclick=async()=>{if(!active)return;const body=$('body').value.trim();if(!body)return alert('Enter interaction notes');if($('makeFollow').checked&&(!$('followTitle').value.trim()||!$('followDue').value))return alert('Enter follow-up action and due date');const r=await sb.from('listing_interactions').insert({listing_interest_id:active.id,contact_id:active.contact_id,activity_type:$('activityType').value,body,interest_level:$('level').value,created_by:me?.id||null,occurred_at:$('occurred').value?new Date($('occurred').value).toISOString():new Date().toISOString()});if(r.error)return alert(r.error.message);if($('makeFollow').checked){const t=await sb.from('tasks').insert({contact_id:active.contact_id,listing_interest_id:active.id,title:$('followTitle').value.trim(),details:'Listing: '+$('property').selectedOptions[0].text+'\n'+body,due_at:new Date($('followDue').value).toISOString(),priority:$('priority').value,assigned_to:$('assignee').value||null});if(t.error){$('message').textContent='Interaction saved, but follow-up failed: '+t.error.message;await history();return}}$('message').textContent='Interaction and requested follow-up saved.';$('body').value='';$('makeFollow').checked=false;$('followFields').classList.add('hidden');await history()};</script></body></html>
